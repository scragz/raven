[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raven"
version = "0.1.0"
description = "RAVE latent trajectory generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
]

[project.scripts]
raven = "raven.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PL",   # pylint
]
ignore = [
    "PLR2004",  # magic-value comparisons are fine in numeric/audio code
    "PLR0913",  # many params are inherent to source generator signatures
]

[tool.ruff.lint.isort]
known-first-party = ["raven"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pyright / Pylance
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["output", "models", ".git", ".venv", "venv"]
# torch / soundfile / scipy ship their own stubs or are missing stubs entirely;
# downgrade to warning so the type-checker stays usable without a full install.
reportMissingImports = "warning"
reportMissingModuleSource = "none"
